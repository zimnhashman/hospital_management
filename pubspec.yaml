name: hospital_management
description: Hospital management system storing patient records

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_cached_pdfview: ^0.4.2
  path_provider: 2.1.2
  path: ^1.8.3
  intl: ^0.19.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  isar_flutter_libs: ^4.0.0-dev.13
  get: ^4.6.6


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Poppins

